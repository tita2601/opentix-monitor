name: OPENTIX LINE Test

on:
  schedule:

    - cron: "0 * * * *"
  
  workflow_dispatch:

jobs:

  test:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore status cache
        uses: actions/cache@v4
        with:
          path: status.json
          key: opentix-status

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      - name: Install packages
        run: |
          pip install -r requirements.txt


      - name: Run Python

        env:

          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}

          LINE_USER: ${{ secrets.LINE_USER }}

        run:
          python main.py
      - name: Save status cache
        uses: actions/cache@v4
        with:
          path: status.json
          key: opentix-status
